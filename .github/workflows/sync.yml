name: Auto Sync Upstream for ios_rule_script

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/blackmatrix7/ios_rule_script.git
          git fetch upstream --tags

      - name: Merge upstream changes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git

          git checkout master

          echo "-----> 合并上游更新（保留本地 workflows）"
          git fetch upstream

          # 使用 theirs 表示：出现冲突时优先采用 upstream 内容
          git merge upstream/master -X theirs --no-edit || true

          echo "-----> 推送"
          git push origin master
